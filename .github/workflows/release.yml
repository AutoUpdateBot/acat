name: Release (macOS ARM64 + Linux x86_64 + Linux ARM64)

# Builds a NATIVE binary per platform/arch and publishes all of them to
# GitHub Releases. Each leg runs on its own hardware — no cross-compilation:
#   macos-14        -> aarch64-apple-darwin
#   ubuntu-24.04    -> x86_64-unknown-linux-gnu
#   ubuntu-24.04-arm -> aarch64-unknown-linux-gnu
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable, minimal profile)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Show native context
        run: |
          uname -m
          rustc -vV | grep host
          echo "target=${{ matrix.target }}"

      - name: Build (extreme size-optimized release profile)
        run: cargo build --release --locked

      - name: Strip + verify + report size
        shell: bash
        run: |
          BIN=target/release/acat
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            strip -x -S "$BIN" || strip "$BIN" || true
            lipo -info "$BIN" || true
          else
            strip "$BIN" || true
          fi
          file "$BIN"
          ls -lh "$BIN"
          du -h "$BIN"

      - name: Verify binary matches its target triple
        shell: bash
        run: |
          BIN=target/release/acat
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              file "$BIN" | grep -q "arm64" || { echo "ERROR: not arm64"; exit 1; }
              file "$BIN" | grep -q "x86_64" && { echo "ERROR: x86_64 slice detected"; exit 1; } || true
              ;;
            x86_64-unknown-linux-gnu)
              file "$BIN" | grep -q "x86-64" || { echo "ERROR: not x86-64"; exit 1; }
              ;;
            aarch64-unknown-linux-gnu)
              file "$BIN" | grep -q -i "aarch64\|arm aarch64" || { echo "ERROR: not aarch64"; exit 1; }
              ;;
          esac

      - name: Package tarball + checksums
        shell: bash
        run: |
          BIN=target/release/acat
          VERSION="${GITHUB_REF_NAME}"
          DIST="acat-${VERSION}-${{ matrix.target }}"
          mkdir -p "$DIST"
          cp "$BIN" "$DIST/acat"
          cp README.md "$DIST/" 2>/dev/null || true
          tar -czf "$DIST.tar.gz" "$DIST"
          (shasum -a 256 "$DIST.tar.gz" || sha256sum "$DIST.tar.gz") | tee "$DIST.tar.gz.sha256"
          ls -lh "$DIST.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acat-${{ matrix.target }}
          path: |
            acat-*.tar.gz
            acat-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
