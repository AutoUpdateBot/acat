name: Release (macOS ARM64 + Linux x86_64 + Linux ARM64)

# Builds a NATIVE binary per platform/arch and publishes all of them to
# GitHub Releases. Each leg runs on its own hardware — no cross-compilation:
#   macos-14        -> aarch64-apple-darwin
#   ubuntu-24.04    -> x86_64-unknown-linux-gnu
#   ubuntu-24.04-arm -> aarch64-unknown-linux-gnu
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust (stable, minimal profile)
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Show native context
        run: |
          uname -m
          rustc -vV | grep host
          echo "target=${{ matrix.target }}"

      - name: Build (extreme size-optimized release profile)
        run: cargo build --release --locked

      - name: Strip + verify + report size
        shell: bash
        run: |
          BIN=target/release/acat
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            strip -x -S "$BIN" || strip "$BIN" || true
            lipo -info "$BIN" || true
          else
            strip "$BIN" || true
          fi
          file "$BIN"
          ls -lh "$BIN"
          du -h "$BIN"

      - name: Verify binary matches its target triple
        shell: bash
        run: |
          BIN=target/release/acat
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              file "$BIN" | grep -q "arm64" || { echo "ERROR: not arm64"; exit 1; }
              file "$BIN" | grep -q "x86_64" && { echo "ERROR: x86_64 slice detected"; exit 1; } || true
              ;;
            x86_64-unknown-linux-gnu)
              file "$BIN" | grep -q "x86-64" || { echo "ERROR: not x86-64"; exit 1; }
              ;;
            aarch64-unknown-linux-gnu)
              file "$BIN" | grep -q -i "aarch64\|arm aarch64" || { echo "ERROR: not aarch64"; exit 1; }
              ;;
          esac

      - name: Package tarball + checksums
        shell: bash
        run: |
          BIN=target/release/acat
          VERSION="${GITHUB_REF_NAME}"
          DIST="acat-${VERSION}-${{ matrix.target }}"
          mkdir -p "$DIST"
          cp "$BIN" "$DIST/acat"
          cp README.md "$DIST/" 2>/dev/null || true
          tar -czf "$DIST.tar.gz" "$DIST"
          (shasum -a 256 "$DIST.tar.gz" || sha256sum "$DIST.tar.gz") | tee "$DIST.tar.gz.sha256"
          ls -lh "$DIST.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: acat-${{ matrix.target }}
          path: |
            acat-*.tar.gz
            acat-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
          generate_release_notes: true
